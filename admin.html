<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — Zavora SMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #1E5EFF;
    --blue-dark: #1547c4;
    --blue-light: #e8efff;
    --black: #0A0A0A;
    --gray: #6b7280;
    --gray-light: #f5f7fb;
    --border: #e5e7eb;
    --white: #ffffff;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --purple: #8b5cf6;
    --sidebar-w: 240px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--gray-light);
    color: var(--black);
    line-height: 1.5;
  }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    position: fixed; left: 0; top: 0;
    width: var(--sidebar-w); height: 100vh;
    background: var(--black); color: white;
    padding: 24px 16px; display: flex; flex-direction: column;
    z-index: 50; overflow-y: auto;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 18px;
    padding: 6px 8px 22px; border-bottom: 1px solid #1e1e1e; margin-bottom: 18px;
  }
  .logo-mark {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    border-radius: 9px; display: grid; place-items: center;
    color: white; font-weight: 900; font-size: 16px;
  }
  .admin-badge {
    font-size: 10px; padding: 2px 7px;
    background: var(--purple); color: white;
    border-radius: 999px; font-weight: 700;
    letter-spacing: 0.4px;
  }
  .nav-section-label {
    font-size: 10.5px; color: #555; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    padding: 0 10px 8px;
  }
  .side-link {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    font-size: 14px; font-weight: 500; color: #b0b0b0;
    margin-bottom: 3px; transition: all 0.15s; cursor: pointer;
  }
  .side-link:hover { background: #161616; color: white; }
  .side-link.active { background: var(--blue); color: white; font-weight: 600; }
  .side-link .ic { width: 20px; text-align: center; font-size: 15px; }
  .side-link .count {
    margin-left: auto; font-size: 11px;
    background: #2a2a2a; padding: 2px 8px;
    border-radius: 999px; font-weight: 700;
  }
  .side-link.active .count { background: rgba(255,255,255,0.2); }
  .sidebar-spacer { flex: 1; }
  .user-mini {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; background: #141414; border-radius: 12px; margin-top: 10px;
  }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--purple); display: grid; place-items: center;
    font-weight: 700; font-size: 13px; color: white; flex-shrink: 0;
  }
  .user-mini .info { overflow: hidden; }
  .user-mini .name {
    font-size: 13px; font-weight: 600; color: white;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .user-mini .email {
    font-size: 11px; color: #777;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ===== MAIN ===== */
  .main { margin-left: var(--sidebar-w); min-height: 100vh; }

  .topbar {
    background: white; border-bottom: 1px solid var(--border);
    padding: 16px 32px; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 40;
  }
  .topbar h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .topbar h1 span { color: var(--gray); font-weight: 500; font-size: 14px; margin-left: 6px; }
  .top-actions { display: flex; gap: 10px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 18px; border-radius: 10px;
    font-weight: 600; font-size: 13.5px; cursor: pointer;
    border: none; transition: all 0.2s ease; white-space: nowrap;
    font-family: inherit;
  }
  .btn-primary { background: var(--blue); color: white; }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-purple { background: var(--purple); color: white; }
  .btn-purple:hover { background: #7c3aed; }
  .btn-outline {
    background: white; color: var(--black);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--black); }
  .btn-danger { background: var(--red); color: white; }
  .btn-danger:hover { background: #dc2626; }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; }
  .btn-ghost { background: transparent; color: var(--gray); }
  .btn-ghost:hover { background: var(--gray-light); color: var(--black); }

  .content { padding: 26px 32px 60px; max-width: 1400px; }

  /* ===== TABS ===== */
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== STATS GRID ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-box {
    background: white; border: 1.5px solid var(--border);
    border-radius: 16px; padding: 22px;
    transition: all 0.15s;
  }
  .stat-box:hover { border-color: var(--blue); }
  .stat-box .ic {
    width: 42px; height: 42px; border-radius: 11px;
    display: grid; place-items: center;
    font-size: 19px; margin-bottom: 14px;
  }
  .stat-box .ic.blue   { background: var(--blue-light); color: var(--blue); }
  .stat-box .ic.green  { background: #dcfce7; color: #15803d; }
  .stat-box .ic.yellow { background: #fef3c7; color: #b45309; }
  .stat-box .ic.purple { background: #ede9fe; color: #6d28d9; }
  .stat-box .num {
    font-size: 26px; font-weight: 800;
    letter-spacing: -0.8px; line-height: 1;
  }
  .stat-box .lbl {
    font-size: 13px; color: var(--gray);
    font-weight: 500; margin-top: 6px;
  }

  /* ===== SECTION HEAD ===== */
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .sec-head h2 {
    font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
  }
  .sec-head .sub { color: var(--gray); font-size: 13px; margin-top: 2px; }
  .sec-head .actions { display: flex; gap: 8px; }

  /* ===== TABLE ===== */
  .table-card {
    background: white; border: 1.5px solid var(--border);
    border-radius: 16px; overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 13px 18px;
    font-size: 11.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--gray); background: var(--gray-light);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 14px 18px; font-size: 13.5px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbff; }

  .cell-icon {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 600;
  }
  .mini-icon {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center; color: white;
    font-size: 14px; font-weight: 800; flex-shrink: 0;
  }

  .pill {
    display: inline-block; padding: 4px 10px;
    border-radius: 999px; font-size: 11.5px;
    font-weight: 700; letter-spacing: 0.2px;
  }
  .pill-green  { background: #dcfce7; color: #15803d; }
  .pill-yellow { background: #fef3c7; color: #b45309; }
  .pill-red    { background: #fee2e2; color: #b91c1c; }
  .pill-blue   { background: var(--blue-light); color: var(--blue); }
  .pill-gray   { background: #f3f4f6; color: #4b5563; }
  .pill-purple { background: #ede9fe; color: #6d28d9; }

  .price-cell {
    font-weight: 800; color: var(--black);
    font-size: 14px; letter-spacing: -0.2px;
  }

  .row-actions {
    display: flex; gap: 6px;
  }
  .act-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1.5px solid var(--border); background: white;
    display: grid; place-items: center;
    font-size: 13px; cursor: pointer;
    transition: all 0.15s;
  }
  .act-btn:hover { border-color: var(--black); }
  .act-btn.edit:hover  { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
  .act-btn.del:hover   { border-color: var(--red); color: var(--red); background: #fee2e2; }
  .act-btn.view:hover  { border-color: var(--green); color: var(--green); background: #dcfce7; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,10,0.6);
    backdrop-filter: blur(4px);
    display: none; z-index: 100;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; animation: fadeIn 0.15s ease; }
  .modal {
    background: white; border-radius: 20px;
    width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    animation: modalIn 0.2s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-head {
    padding: 22px 26px 16px;
    border-bottom: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-head h3 {
    font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
  }
  .modal-close {
    width: 34px; height: 34px; border-radius: 9px;
    border: 1.5px solid var(--border); background: white;
    display: grid; place-items: center; font-size: 16px;
    color: var(--gray);
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }

  .modal-body { padding: 22px 26px; }
  .modal-foot {
    padding: 16px 26px 22px;
    display: flex; gap: 10px; justify-content: flex-end;
    border-top: 1.5px solid var(--border);
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12.5px;
    font-weight: 700; margin-bottom: 7px;
    color: var(--black); letter-spacing: 0.1px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 14px;
    font-family: inherit; background: white;
    transition: all 0.15s;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(30,94,255,0.1);
  }
  .field .hint {
    font-size: 11.5px; color: var(--gray);
    margin-top: 5px; font-weight: 500;
  }
  .field-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .empty-state {
    padding: 48px 20px; text-align: center;
    color: var(--gray); font-size: 14px;
  }
  .empty-state .emoji { font-size: 34px; display: block; margin-bottom: 10px; opacity: 0.6; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; top: 22px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--black); color: white;
    padding: 12px 22px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: all 0.25s; z-index: 200;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green); }
  .toast.error   { background: var(--red); }
  .toast.info    { background: var(--blue); }

  /* ===== SEARCH BOX ===== */
  .search-box {
    position: relative; max-width: 280px; flex: 1;
  }
  .search-box input {
    width: 100%; padding: 9px 14px 9px 36px;
    border: 1.5px solid var(--border); border-radius: 10px;
    font-size: 13.5px; font-family: inherit; background: white;
  }
  .search-box input:focus {
    outline: none; border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(30,94,255,0.1);
  }
  .search-box .ico {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); color: var(--gray);
    font-size: 14px; pointer-events: none;
  }

  /* ===== LOADING ===== */
  .loading {
    padding: 60px 20px; text-align: center;
  }
  .loading .spinner {
    width: 40px; height: 40px; margin: 0 auto 14px;
    border: 3px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--gray); font-size: 14px; }

  /* ===== MOBILE ===== */
  .mobile-top {
    display: none; background: white; padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 40;
  }
  @media (max-width: 800px) {
    :root { --sidebar-w: 0px; }
    .sidebar { transform: translateX(-100%); transition: transform 0.25s; width: 250px; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .mobile-top { display: flex; }
    .topbar { display: none; }
    .content { padding: 20px 16px 60px; }
    .table-card { overflow-x: auto; }
    table { min-width: 700px; }
    .field-row { grid-template-columns: 1fr; }
  }
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 45;
  }
  .overlay.show { display: block; }
</style>
</head>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Edit</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
  /* ============================================================
     UI HELPERS (outside module)
  ============================================================ */
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }
  window.toggleSidebar = toggleSidebar;

  window.showToast = function (msg, type = 'success') {
    const t = document.getElementById('toast');
    const icons = { success: '✓', error: '✕', info: 'ℹ' };
    t.innerHTML = `<span>${icons[type] || '✓'}</span> ${msg}`;
    t.className = 'toast show ' + type;
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.className = 'toast ' + type, 2500);
  };

  window.openModal = function (title, bodyHTML, footHTML) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHTML;
    document.getElementById('modalFoot').innerHTML = footHTML;
    document.getElementById('modalOverlay').classList.add('show');
  };
  window.closeModal = function () {
    document.getElementById('modalOverlay').classList.remove('show');
  };
</script>

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }

    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) { window.location.href = 'register.html'; return; }

    const data = snap.data();
    if (data.role !== 'admin') {
      alert('Access denied. You are not an admin.');
      window.location.href = 'dashboard.html';
      return;
    }

    currentUser = user;
    currentAdmin = data;

    document.getElementById('avatar').textContent   = (data.firstName?.[0] || 'A').toUpperCase();
    document.getElementById('userName').textContent = `${data.firstName || 'Admin'} ${data.lastName || ''}`.trim();
    document.getElementById('userEmail').textContent = data.email || '';

    await loadAllData();
    switchTab('overview');
  });

  /* ============================================================
     LOAD ALL DATA FROM FIRESTORE
  ============================================================ */
  async function loadAllData() {
    await Promise.all([
      loadProducts(),
      loadCountries(),
      loadUsers(),
      loadOrders()
    ]);
    updateSidebarCounts();
  }

  async function loadProducts() {
    try {
      const snap = await getDocs(collection(db, 'config_products'));
      products = [];
      snap.forEach(d => products.push({ id: d.id, ...d.data() }));
      products.sort((a, b) => (a.order || 0) - (b.order || 0));
    } catch (err) {
      console.error('Products load error:', err);
      products = [];
    }
  }

  async function loadCountries() {
    try {
      const snap = await getDocs(collection(db, 'config_countries'));
      countries = [];
      snap.forEach(d => countries.push({ id: d.id, ...d.data() }));
      countries.sort((a, b) => (a.order || 0) - (b.order || 0));
    } catch (err) {
      console.error('Countries load error:', err);
      countries = [];
    }
  }

  async function loadUsers() {
    try {
      const snap = await getDocs(collection(db, 'users'));
      allUsers = [];
      snap.forEach(d => allUsers.push({ uid: d.id, ...d.data() }));
      allUsers.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    } catch (err) {
      console.error('Users load error:', err);
      allUsers = [];
    }
  }

  async function loadOrders() {
    try {
      const snap = await getDocs(collection(db, 'orders'));
      allOrders = [];
      snap.forEach(d => allOrders.push({ id: d.id, ...d.data() }));
      allOrders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    } catch (err) {
      console.error('Orders load error:', err);
      allOrders = [];
    }
  }

    document.getElementById('productsCount').textContent  = products.length;
    document.getElementById('countriesCount').textContent = countries.length;
    document.getElementById('usersCount').textContent     = allUsers.length;
    document.getElementById('ordersCount').textContent    = allOrders.length;

  window.saveProduct = async function () {
    const name = document.getElementById('pName').value.trim();
    const icon = document.getElementById('pIcon').value.trim() || '?';
    const id = document.getElementById('pId').value.trim().toLowerCase().replace(/\s+/g, '');
    const cls = document.getElementById('pCls').value;
    const stock = parseInt(document.getElementById('pStock').value) || 0;

    if (!name || !id) { showToast('Name and ID are required', 'error'); return; }
    if (products.some(p => p.id === id)) { showToast('Product ID already exists', 'error'); return; }

    try {
      await setDoc(doc(db, 'config_products', id), {
        name, icon, cls, stock,
        order: products.length + 1,
        createdAt: serverTimestamp()
      });
      closeModal();
      showToast('Product added!', 'success');
      await loadProducts();
      updateSidebarCounts();
      renderProducts();
    } catch (err) {
      console.error(err);
      showToast('Could not save product', 'error');
    }
  };

  window.editProduct = function (id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    window.openModal(
      'Edit Product',
      `<div class="field">
        <label>Product Name</label>
        <input type="text" id="pName" value="${p.name}" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Icon</label>
          <input type="text" id="pIcon" value="${p.icon || ''}" maxlength="4" />
        </div>
        <div class="field">
          <label>Product ID (read-only)</label>
          <input type="text" id="pId" value="${p.id}" disabled style="opacity:0.6;" />
        </div>
      </div>
      <div class="field">
        <label>Icon Color Class</label>
        <select id="pCls">
          ${['ic-whatsapp','ic-telegram','ic-facebook','ic-instagram','ic-google','ic-tiktok','ic-twitter','ic-amazon','ic-apple','ic-snapchat','ic-discord','ic-signal','ic-pof','ic-match','ic-tagged','ic-uber','ic-more']
            .map(c => `<option value="${c}" ${p.cls === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Stock (pcs)</label>
        <input type="number" id="pStock" value="${p.stock || 0}" min="0" />
      </div>`,
      `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="updateProduct('${p.id}')">Save Changes</button>`
    );
  };

  window.updateProduct = async function (id) {
    const name = document.getElementById('pName').value.trim();
    const icon = document.getElementById('pIcon').value.trim() || '?';
    const cls = document.getElementById('pCls').value;
    const stock = parseInt(document.getElementById('pStock').value) || 0;

    if (!name) { showToast('Name required', 'error'); return; }

    try {
      await updateDoc(doc(db, 'config_products', id), { name, icon, cls, stock });
      closeModal();
      showToast('Product updated!', 'success');
      await loadProducts();
      renderProducts();
    } catch (err) {
      console.error(err);
      showToast('Could not update', 'error');
    }
  };

  window.deleteProduct = async function (id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    if (!confirm(`Delete "${p.name}"?\n\nThis cannot be undone.`)) return;
    try {
      await deleteDoc(doc(db, 'config_products', id));
      showToast('Product deleted', 'success');
      await loadProducts();
      updateSidebarCounts();
      renderProducts();
    } catch (err) {
      console.error(err);
      showToast('Could not delete', 'error');
    }
  };

  /* ============================================================
     COUNTRY CRUD
  ============================================================ */
  window.addCountry = function () {
    window.openModal(
      'Add Country',
      `<div class="field">
        <label>Country Name</label>
        <input type="text" id="cName" placeholder="e.g. United States" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Flag (emoji)</label>
          <input type="text" id="cFlag" placeholder="🇺🇸" maxlength="6" />
        </div>
        <div class="field">
          <label>Dial Code</label>
          <input type="text" id="cDial" placeholder="+1" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Price (₦ NGN)</label>
          <input type="number" id="cPrice" value="1000" min="0" />
        </div>
        <div class="field">
          <label>Stock (pcs)</label>
          <input type="number" id="cStock" value="1000" min="0" />
        </div>
      </div>
      <div class="field">
        <label>Country ID (lowercase, no spaces)</label>
        <input type="text" id="cId" placeholder="us" />
        <div class="hint">Used internally. Must be unique.</div>
      </div>`,
      `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveCountry()">Save Country</button>`
    );
  };

  window.saveCountry = async function () {
    const name = document.getElementById('cName').value.trim();
    const flag = document.getElementById('cFlag').value.trim() || '🌍';
    const dial = document.getElementById('cDial').value.trim() || '';
    const price = parseInt(document.getElementById('cPrice').value) || 0;
    const stock = parseInt(document.getElementById('cStock').value) || 0;
    const id = document.getElementById('cId').value.trim().toLowerCase().replace(/\s+/g, '');

    if (!name || !id) { showToast('Name and ID required', 'error'); return; }
    if (countries.some(c => c.id === id)) { showToast('Country ID already exists', 'error'); return; }

    try {
      await setDoc(doc(db, 'config_countries', id), {
        name, flag, dial, price, stock,
        order: countries.length + 1,
        createdAt: serverTimestamp()
      });
      closeModal();
      showToast('Country added!', 'success');
      await loadCountries();
      updateSidebarCounts();
      renderCountries();
    } catch (err) {
      console.error(err);
      showToast('Could not save country', 'error');
    }
  };

  window.editCountry = function (id) {
    const c = countries.find(x => x.id === id);
    if (!c) return;
    window.openModal(
      'Edit Country',
      `<div class="field">
        <label>Country Name</label>
        <input type="text" id="cName" value="${c.name}" />
      </div>
      <div class="field-row">
        <div class="field">
          <label>Flag</label>
          <input type="text" id="cFlag" value="${c.flag || ''}" maxlength="6" />
        </div>
        <div class="field">
          <label>Dial Code</label>
          <input type="text" id="cDial" value="${c.dial || ''}" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Price (₦ NGN)</label>
          <input type="number" id="cPrice" value="${c.price || 0}" min="0" />
        </div>
        <div class="field">
          <label>Stock (pcs)</label>
          <input type="number" id="cStock" value="${c.stock || 0}" min="0" />
        </div>
      </div>`,
      `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="updateCountry('${c.id}')">Save Changes</button>`
    );
  };

  window.updateCountry = async function (id) {
    const name = document.getElementById('cName').value.trim();
    const flag = document.getElementById('cFlag').value.trim() || '🌍';
    const dial = document.getElementById('cDial').value.trim();
    const price = parseInt(document.getElementById('cPrice').value) || 0;
    const stock = parseInt(document.getElementById('cStock').value) || 0;

    if (!name) { showToast('Name required', 'error'); return; }

    try {
      await updateDoc(doc(db, 'config_countries', id), { name, flag, dial, price, stock });
      closeModal();
      showToast('Country updated!', 'success');
      await loadCountries();
      renderCountries();
    } catch (err) {
      console.error(err);
      showToast('Could not update', 'error');
    }
  };

  window.deleteCountry = async function (id) {
    const c = countries.find(x => x.id === id);
    if (!c) return;
    if (!confirm(`Delete "${c.name}"?\n\nThis cannot be undone.`)) return;
    try {
      await deleteDoc(doc(db, 'config_countries', id));
      showToast('Country deleted', 'success');
      await loadCountries();
      updateSidebarCounts();
      renderCountries();
    } catch (err) {
      console.error(err);
      showToast('Could not delete', 'error');
    }
  };

  /* ============================================================
     USER WALLET ADJUST
  ============================================================ */
  window.editUserWallet = function (uid) {
    const u = allUsers.find(x => x.uid === uid);
    if (!u) return;
    window.openModal(
      `Adjust Wallet — ${u.firstName || 'User'}`,
      `<div class="field">
        <label>Current Balance</label>
        <input type="text" value="₦${Number(u.walletBalance || 0).toLocaleString()}" disabled style="opacity:0.6;" />
      </div>
      <div class="field">
        <label>New Balance (₦ NGN)</label>
        <input type="number" id="uBalance" value="${u.walletBalance || 0}" min="0" />
        <div class="hint">Set the exact new wallet balance</div>
      </div>`,
      `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
       <button class="btn btn-primary" onclick="saveUserWallet('${uid}')">Save</button>`
    );
  };

  window.saveUserWallet = async function (uid) {
    const val = parseFloat(document.getElementById('uBalance').value) || 0;
    try {
      await updateDoc(doc(db, 'users', uid), { walletBalance: val });
      closeModal();
      showToast('Wallet updated!', 'success');
      await loadUsers();
      renderUsers();
    } catch (err) {
      console.error(err);
      showToast('Could not update wallet', 'error');
    }
  };

  /* ============================================================
     ORDER CANCEL
  ============================================================ */
  window.cancelOrder = async function (id) {
    const o = allOrders.find(x => x.id === id);
    if (!o) return;
    if (!confirm(`Cancel this order?\n\n${o.product} — ${o.country}\n₦${(o.price || 0).toLocaleString()}`)) return;
    try {
      await updateDoc(doc(db, 'orders', id), {
        status: 'cancelled',
        cancelledAt: serverTimestamp()
      });
      showToast('Order cancelled', 'success');
      await loadOrders();
      renderOrders();
    } catch (err) {
      console.error(err);
      showToast('Could not cancel', 'error');
    }
  };

  /* ============================================================
     SEED DEFAULT DATA
  ============================================================ */
  document.getElementById('seedBtn').addEventListener('click', async () => {
    if (!confirm('Seed default products + countries?\n\nThis adds 16 products and 15 countries.\n\nExisting entries with same IDs will be overwritten.')) return;

    showToast('Seeding data...', 'info');

    try {
      for (const p of DEFAULT_PRODUCTS) {
        await setDoc(doc(db, 'config_products', p.id), { ...p, createdAt: serverTimestamp() });
      }
      for (const c of DEFAULT_COUNTRIES) {
        await setDoc(doc(db, 'config_countries', c.id), { ...c, createdAt: serverTimestamp() });
      }
      showToast('✅ Seeded! 16 products + 15 countries', 'success');
      await loadAllData();
      switchTab(currentTab);
    } catch (err) {
      console.error(err);
      showToast('Seed failed', 'error');
    }
  });

  /* ============================================================
     LOGOUT
  ============================================================ */
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'login.html';
  });
</script>

</body>
</html>
