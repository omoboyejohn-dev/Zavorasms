<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — Zavora SMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --blue: #1E5EFF; --blue-dark: #1547c4; --blue-light: #e8efff;
    --black: #0A0A0A; --gray: #6b7280; --gray-light: #f5f7fb;
    --border: #e5e7eb; --white: #ffffff; --green: #10b981;
    --yellow: #f59e0b; --red: #ef4444; --purple: #8b5cf6;
    --sidebar-w: 240px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--gray-light); color: var(--black); line-height: 1.5; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  .sidebar { position: fixed; left: 0; top: 0; width: var(--sidebar-w); height: 100vh; background: var(--black); color: white; padding: 24px 16px; display: flex; flex-direction: column; z-index: 50; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; padding: 6px 8px 22px; border-bottom: 1px solid #1e1e1e; margin-bottom: 18px; }
  .logo-mark { width: 34px; height: 34px; background: linear-gradient(135deg, var(--blue), var(--purple)); border-radius: 9px; display: grid; place-items: center; color: white; font-weight: 900; font-size: 16px; }
  .nav-section-label { font-size: 10.5px; color: #555; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; padding: 0 10px 8px; }
  .side-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #b0b0b0; margin-bottom: 3px; transition: all 0.15s; cursor: pointer; }
  .side-link:hover { background: #161616; color: white; }
  .side-link.active { background: var(--blue); color: white; font-weight: 600; }
  .side-link .ic { width: 20px; text-align: center; font-size: 15px; }
  .side-link .count { margin-left: auto; font-size: 11px; background: #2a2a2a; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
  .side-link.active .count { background: rgba(255,255,255,0.2); }
  .sidebar-spacer { flex: 1; }
  .user-mini { display: flex; align-items: center; gap: 10px; padding: 12px; background: #141414; border-radius: 12px; margin-top: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--purple); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: white; flex-shrink: 0; }
  .user-mini .info { overflow: hidden; }
  .user-mini .name { font-size: 13px; font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-mini .email { font-size: 11px; color: #777; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .main { margin-left: var(--sidebar-w); min-height: 100vh; }
  .topbar { background: white; border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
  .topbar h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
  .topbar h1 span { color: var(--gray); font-weight: 500; font-size: 14px; margin-left: 6px; }
  .top-actions { display: flex; gap: 10px; align-items: center; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; border: none; transition: all 0.2s ease; white-space: nowrap; font-family: inherit; }
  .btn-primary { background: var(--blue); color: white; }
  .btn-primary:hover { background: var(--blue-dark); }
  .btn-outline { background: white; color: var(--black); border: 1.5px solid var(--border); }
  .btn-outline:hover { border-color: var(--black); }

  .content { padding: 26px 32px 60px; max-width: 1400px; }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .stat-box { background: white; border: 1.5px solid var(--border); border-radius: 16px; padding: 22px; transition: all 0.15s; }
  .stat-box:hover { border-color: var(--blue); }
  .stat-box .ic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; margin-bottom: 14px; }
  .stat-box .ic.blue { background: var(--blue-light); color: var(--blue); }
  .stat-box .ic.green { background: #dcfce7; color: #15803d; }
  .stat-box .ic.yellow { background: #fef3c7; color: #b45309; }
  .stat-box .ic.purple { background: #ede9fe; color: #6d28d9; }
  .stat-box .num { font-size: 26px; font-weight: 800; letter-spacing: -0.8px; line-height: 1; }
  .stat-box .lbl { font-size: 13px; color: var(--gray); font-weight: 500; margin-top: 6px; }

  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .sec-head h2 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .sec-head .sub { color: var(--gray); font-size: 13px; margin-top: 2px; }
  .sec-head .actions { display: flex; gap: 8px; }

  .table-card { background: white; border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; padding: 13px 18px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray); background: var(--gray-light); border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody td { padding: 14px 18px; font-size: 13.5px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbff; }

  .cell-icon { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
  .mini-icon { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: white; font-size: 14px; font-weight: 800; flex-shrink: 0; }

  .pill { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.2px; }
  .pill-green { background: #dcfce7; color: #15803d; }
  .pill-yellow { background: #fef3c7; color: #b45309; }
  .pill-red { background: #fee2e2; color: #b91c1c; }
  .pill-blue { background: var(--blue-light); color: var(--blue); }
  .pill-gray { background: #f3f4f6; color: #4b5563; }
  .pill-purple { background: #ede9fe; color: #6d28d9; }

  .order-badge { display: inline-block; padding: 3px 9px; background: var(--gray-light); color: var(--gray); border-radius: 6px; font-weight: 700; font-size: 12px; min-width: 32px; text-align: center; font-family: 'Courier New', monospace; }
  .price-cell { font-weight: 800; color: var(--black); font-size: 14px; letter-spacing: -0.2px; }

  .row-actions { display: flex; gap: 6px; }
  .act-btn { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border); background: white; display: grid; place-items: center; font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .act-btn:hover { border-color: var(--black); }
  .act-btn.edit:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
  .act-btn.del:hover { border-color: var(--red); color: var(--red); background: #fee2e2; }
  .act-btn.approve { background: #dcfce7; border-color: #86efac; color: #15803d; }
  .act-btn.approve:hover { background: #15803d; color: white; border-color: #15803d; }
  .act-btn.approve:disabled, .act-btn.del:disabled { opacity: 0.5; cursor: not-allowed; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(10,10,10,0.6); backdrop-filter: blur(4px); display: none; z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 20px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,0.3); }
  .modal-head { padding: 22px 26px 16px; border-bottom: 1.5px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
  .modal-close { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--border); background: white; display: grid; place-items: center; font-size: 16px; color: var(--gray); }
  .modal-close:hover { border-color: var(--red); color: var(--red); }
  .modal-body { padding: 22px 26px; }
  .modal-foot { padding: 16px 26px 22px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1.5px solid var(--border); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 7px; color: var(--black); letter-spacing: 0.1px; }
  .field input, .field select, .field textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: white; transition: all 0.15s; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(30,94,255,0.1); }
  .field .hint { font-size: 11.5px; color: var(--gray); margin-top: 5px; font-weight: 500; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .empty-state { padding: 48px 20px; text-align: center; color: var(--gray); font-size: 14px; }
  .empty-state .emoji { font-size: 34px; display: block; margin-bottom: 10px; opacity: 0.6; }

  .toast { position: fixed; top: 22px; left: 50%; transform: translateX(-50%) translateY(-20px); background: var(--black); color: white; padding: 12px 22px; border-radius: 12px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 200; box-shadow: 0 12px 32px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 10px; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--green); }
  .toast.error { background: var(--red); }
  .toast.info { background: var(--blue); }

  .search-box { position: relative; max-width: 280px; flex: 1; }
  .search-box input { width: 100%; padding: 9px 14px 9px 36px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 13.5px; font-family: inherit; background: white; }
  .search-box input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(30,94,255,0.1); }
  .search-box .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray); font-size: 14px; pointer-events: none; }

  .loading { padding: 60px 20px; text-align: center; }
  .loading .spinner { width: 40px; height: 40px; margin: 0 auto 14px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: var(--gray); font-size: 14px; }

  .mobile-top { display: none; background: white; padding: 14px 20px; border-bottom: 1px solid var(--border); align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 40; }
  @media (max-width: 800px) {
    :root { --sidebar-w: 0px; }
    .sidebar { transform: translateX(-100%); transition: transform 0.25s; width: 250px; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .mobile-top { display: flex; }
    .topbar { display: none; }
    .content { padding: 20px 16px 60px; }
    .table-card { overflow-x: auto; }
    table { min-width: 700px; }
    .field-row { grid-template-columns: 1fr; }
  }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 45; }
  .overlay.show { display: block; }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar">

    <div class="logo-mark">Z</div>

<main class="main">

    <div class="loading">
      <div class="spinner"></div>
      <p>Loading admin panel...</p>
    </div>
  </div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Edit</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }
  window.toggleSidebar = toggleSidebar;

  window.showToast = function (msg, type = 'success') {
    const t = document.getElementById('toast');
    const icons = { success: '✓', error: '✕', info: 'ℹ' };
    t.innerHTML = `<span>${icons[type] || '✓'}</span> ${msg}`;
    t.className = 'toast show ' + type;
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.className = 'toast ' + type, 2500);
  };

  window.openModal = function (title, bodyHTML, footHTML) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = bodyHTML;
    document.getElementById('modalFoot').innerHTML = footHTML;
    document.getElementById('modalOverlay').classList.add('show');
  };
  window.closeModal = function () {
    document.getElementById('modalOverlay').classList.remove('show');
  };
</script>

  let currentUser = null;

  let products = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'login.html'; return; }

    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) { window.location.href = 'register.html'; return; }

    const data = snap.data();
    if (data.role !== 'admin') {
      alert('Access denied. You are not an admin.');
      window.location.href = 'dashboard.html';
      return;
    }

    currentUser = user;
    currentAdmin = data;

    document.getElementById('avatar').textContent   = (data.firstName?.[0] || 'A').toUpperCase();
    document.getElementById('userName').textContent = `${data.firstName || 'Admin'} ${data.lastName || ''}`.trim();

    await loadAllData();
    switchTab('overview');

  async function loadAllData() {
    await Promise.all([
      loadProducts(),
      loadUsaProducts(),
      loadCountries(),
      loadUsers(),
      loadOrders(),
      loadDeposits()
    ]);
    updateSidebarCounts();
  }

  async function loadProducts() {
    try {
      const snap = await getDocs(collection(db, 'config_products'));
      products = [];
      snap.forEach(d => products.push({ id: d.id, ...d.data() }));
      products.sort((a, b) => (a.order || 0) - (b.order || 0));
    } catch (err) { console.error(err); products = []; }

              <th>Reference</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="depBody">${allDeposits.map(rowDeposit).join('')}</tbody>
        </table>
      </div>
    `;

    document.getElementById('depSearch').addEventListener('input', (e) => {
      const f = e.target.value.toLowerCase();
      const filtered = allDeposits.filter(d =>
        (d.email || '').toLowerCase().includes(f) ||
        (d.reference || '').toLowerCase().includes(f) ||
        (d.senderName || '').toLowerCase().includes(f)
      );
      document.getElementById('depBody').innerHTML = filtered.map(rowDeposit).join('');
    });
  }

  function rowDeposit(d, idx) {
    const statusPill =
      d.status === 'completed' ? 'pill-green' :
      d.status === 'pending'   ? 'pill-yellow' :
      d.status === 'rejected'  ? 'pill-red' : 'pill-gray';

    const actions = d.status === 'pending'
      ? `<button class="act-btn approve" id="approve-${d.id}" onclick="approveDeposit('${d.id}')" title="Approve">✓</button>
         <button class="act-btn del" id="reject-${d.id}" onclick="rejectDeposit('${d.id}')" title="Reject" style="margin-left:6px;">✕</button>`
      : `<span style="color:var(--gray); font-size:12px;">—</span>`;

    return `
      <tr>
        <td style="color:var(--gray); font-weight:600;">${idx + 1}</td>
        <td>${d.email || '—'}</td>
        <td><span class="price-cell">₦${Number(d.amount || 0).toLocaleString()}</span></td>
        <td>${d.senderName || '—'}</td>
        <td><code style="font-size:12px;">${d.reference || '—'}</code></td>
        <td><span class="pill ${statusPill}">${d.status || 'pending'}</span></td>
        <td><div class="row-actions">${actions}</div></td>
      </tr>
    `;
  }

  /* APPROVE / REJECT DEPOSIT */
  window.approveDeposit = async function (id) {
    if (window.__approvingDeposit) return;
    window.__approvingDeposit = true;

    const approveBtn = document.getElementById(`approve-${id}`);
    const rejectBtn  = document.getElementById(`reject-${id}`);
    if (approveBtn) { approveBtn.disabled = true; approveBtn.textContent = '...'; }
    if (rejectBtn)  { rejectBtn.disabled = true; }

    try {
      const depRef = doc(db, 'deposits', id);
      const freshSnap = await getDoc(depRef);
      if (!freshSnap.exists()) { showToast('Deposit no longer exists', 'error'); return; }
      const d = freshSnap.data();

      if (d.status !== 'pending') {
        showToast(`This deposit was already ${d.status}.`, 'error');
        await loadDeposits(); await loadUsers(); updateSidebarCounts(); renderDeposits();
        return;
      }

      if (!confirm(`Approve deposit?\n\nUser: ${d.email}\nAmount: ₦${Number(d.amount).toLocaleString()}\n\nThis will credit the user's wallet immediately.`)) return;

      await updateDoc(depRef, { status: 'completed', approvedAt: serverTimestamp(), approvedBy: currentUser.uid });
      await updateDoc(doc(db, 'users', d.uid), { walletBalance: increment(d.amount || 0) });

      showToast(`✅ Credited ₦${Number(d.amount).toLocaleString()}`, 'success');
      await loadDeposits(); await loadUsers(); updateSidebarCounts(); renderDeposits();
    } catch (err) {
      console.error(err);
      showToast('Could not approve deposit', 'error');
      await loadDeposits(); renderDeposits();
    } finally {
      window.__approvingDeposit = false;
    }
  };

  window.rejectDeposit = async function (id) {

    window.__rejectingDeposit = true;

    const approveBtn = document.getElementById(`approve-${id}`);
    const rejectBtn  = document.getElementById(`reject-${id}`);
    if (approveBtn) approveBtn.disabled = true;
    if (rejectBtn) { rejectBtn.disabled = true; rejectBtn.textContent = '...'; }

    try {
      const depRef = doc(db, 'deposits', id);
      const freshSnap = await getDoc(depRef);
      if (!freshSnap.exists()) { showToast('Deposit no longer exists', 'error'); return; }
      const d = freshSnap.data();

      if (d.status !== 'pending') {

      if (!confirm(`Reject this deposit?\n\nUser: ${d.email}\nAmount: ₦${Number(d.amount).toLocaleString()}`)) return;
